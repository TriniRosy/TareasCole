<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Organizador Kawaii de Trinidad 🌸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">

<body>
    <!-- Barra superior con botón hamburguesa -->
    <header class="barra-superior">
        <button class="boton-hamburguesa" id="boton-hamburguesa" aria-label="Abrir menú">☰</button>
        <span class="titulo-app">🌸 Organizador Kawaii 🌸</span>

    <!-- Fondo oscuro para móvil (se activa al abrir la barra) -->
    <div class="fondo-oscuro" id="fondo-oscuro"></div>

    <!-- Contenedor de la barra lateral (se llenará con JavaScript) -->
    <div id="contenedor-barra-lateral"></div>

    <!-- Contenido principal de la SPA -->
    <main id="contenido-principal" class="contenido-principal">
        <!-- Aquí se renderizará la vista activa -->
    </main>

    <!-- Pie de página -->
    <footer class="pie-pagina">
        Hecho con <span class="corazon">💖</span> para Trinidad Quilodrán · 5° Básico · Chile 🇨🇱
    </footer>

    <!-- Script principal de la aplicación (ES Modules) -->
    <script type="module" src="./js/app.js"></script>
