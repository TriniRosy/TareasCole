<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<title>Ruletas de Multiplicar</title>
<style>
  :root{
    --accent:#ffd166;
    --ok:#4ade80;
    --bad:#f87171;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#0a1220;
    color:#eaf0ff;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select:none; user-select:none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  #app{
    display:flex;
    height:100vh; height:100dvh;
    width:100vw;
    padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
             max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    gap:8px;
    background: radial-gradient(120% 130% at 50% 0%, #1b2a4a 0%, #0a1220 65%);
  }

  /* ---------- RULETAS ---------- */
  #wheels{
    flex:1 1 0;
    min-width:0; min-height:0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .wheel-wrap{ position:relative; flex:0 0 auto; }
  canvas{ display:block; border-radius:50%; }
  .pointer{
    position:absolute; top:-7px; left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:19px solid var(--accent);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.65));
    z-index:2;
  }
  .x-sign{
    flex:0 0 auto;
    font-size: clamp(18px, 6vmin, 44px);
    font-weight:900;
    color:var(--accent);
    text-shadow: 0 2px 10px rgba(255,209,102,.45);
  }

  /* ---------- PANEL ---------- */
  #panel{
    flex:0 0 auto;
    width: clamp(132px, 31vw, 300px);
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .top-row{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    flex:0 0 auto;
  }
  .score{
    display:flex; gap:8px;
    font-size: clamp(11px, 2.6vmin, 16px);
    font-weight:800;
  }
  .score .ok{ color:var(--ok); }
  .score .no{ color:var(--bad); }
  .score b{ font-variant-numeric: tabular-nums; }

  .timer{
    font-size: clamp(17px, 5.2vmin, 34px);
    font-weight:900;
    font-variant-numeric: tabular-nums;
    line-height:1;
    color:#fff;
    transition: color .15s;
  }
  .timer.low{ color:var(--bad); animation: pulse .45s infinite alternate; }
  @keyframes pulse{ from{ transform:scale(1);} to{ transform:scale(1.18);} }

  .bar{
    flex:0 0 auto;
    height:6px;
    border-radius:4px;
    background:rgba(255,255,255,.12);
    overflow:hidden;
  }
  .bar i{
    display:block; height:100%; width:100%;
    border-radius:4px;
    background:linear-gradient(90deg,#4ade80,#ffd166);
  }
  .bar i.low{ background:linear-gradient(90deg,#ff4d6d,#ff8fa3); }

  #display{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; gap:6px;
    min-height: clamp(36px, 9vmin, 62px);
    padding: 2px 8px;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    font-size: clamp(15px, 4.4vmin, 30px);
    font-weight:900;
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
  }
  #qText{ color:#cfe0ff; }
  .eq{ color:#7d8fb3; }
  #aText{ color:var(--accent); min-width:1.4ch; text-align:center; }

  @keyframes flashOk{ 0%,100%{ background:rgba(255,255,255,.06);} 50%{ background:rgba(74,222,128,.38);} }
  @keyframes flashBad{ 0%,100%{ background:rgba(255,255,255,.06);} 50%{ background:rgba(248,113,113,.38);} }
  #display.flash-ok{ animation: flashOk .5s ease 2; }
  #display.flash-bad{ animation: flashBad .3s ease 2; }

  /* ---------- TECLADO ---------- */
  #keypad{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:5px;
    transition: opacity .2s;
  }
  #keypad button{
    border:none; padding:0; margin:0;
    border-radius:10px;
    background:linear-gradient(#243553,#1a2740);
    color:#eaf0ff;
    font-family:inherit;
    font-weight:900;
    font-size: clamp(13px, 4vmin, 24px);
    box-shadow: 0 2px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.09);
    cursor:pointer;
    transition: transform .05s, filter .05s;
    touch-action: manipulation;
  }
  #keypad button:active{ transform:translateY(2px); filter:brightness(1.3); box-shadow:none; }
  #keypad button.fn{ background:linear-gradient(#3a2f4f,#2a2038); color:var(--accent); }
  #keypad button.ok{ background:linear-gradient(#1f7a4d,#14603a); color:#d9ffe9; }
  #keypad.disabled{ opacity:.32; pointer-events:none; }

  /* ---------- BOTÓN GIRAR ---------- */
  #spinBtn{
    flex:0 0 auto;
    border:none;
    border-radius:12px;
    padding: clamp(7px, 1.9vmin, 15px);
    font-family:inherit;
    font-weight:900;
    letter-spacing:.08em;
    font-size: clamp(13px, 3.8vmin, 24px);
    color:#241800;
    background:linear-gradient(#ffe08a,#ffb703);
    box-shadow: 0 3px 0 #b57e00, 0 6px 18px rgba(255,183,3,.28);
    cursor:pointer;
    transition: transform .05s, box-shadow .05s, filter .2s;
  }
  #spinBtn:active{ transform:translateY(3px); box-shadow:0 0 0 #b57e00; }
  #spinBtn:disabled{ filter:grayscale(.65) brightness(.65); box-shadow:none; transform:none; cursor:default; }

  /* ---------- AVISO ROTAR ---------- */
  #rotate{
    position:fixed; inset:0; z-index:99;
    display:none;
    flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px;
    text-align:center;
    padding:24px;
    font-size:19px;
    font-weight:800;
    color:#dbe6ff;
    background:radial-gradient(circle at 50% 40%, #1b2a4a, #070d18 70%);
  }
  #rotate .icon{ font-size:56px; animation: turn 2s ease-in-out infinite; }
  @keyframes turn{ 0%,40%{ transform:rotate(0);} 60%,100%{ transform:rotate(90deg);} }

  @media (orientation: portrait) and (max-width: 900px){
    #rotate{ display:flex; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="wheels">
    <div class="wheel-wrap" id="wrap1">
      <canvas id="w1"></canvas>
      <div class="pointer"></div>
    </div>
    <div class="x-sign">×</div>
    <div class="wheel-wrap" id="wrap2">
      <canvas id="w2"></canvas>
      <div class="pointer"></div>
    </div>
  </div>

  <div id="panel">
    <div class="top-row">
      <div class="score">
        <span class="ok">✔ <b id="hits">0</b></span>
        <span class="no">✘ <b id="misses">0</b></span>
      </div>
      <div class="timer" id="timerNum">10</div>
    </div>

    <div class="bar"><i id="timerBar"></i></div>

    <div id="display">
      <span id="qText">? × ?</span>
      <span class="eq">=</span>
      <span id="aText">?</span>
    </div>

    <div id="keypad" class="disabled">
      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button data-k="del" class="fn">⌫</button>
      <button data-k="0">0</button>
      <button data-k="ok" class="fn ok">✓</button>
    </div>

    <button id="spinBtn">GIRAR</button>
  </div>
</div>

<div id="rotate">
  <div class="icon">📱</div>
  <div>Gira el teléfono<br>para jugar en horizontal</div>
</div>

<script>
(function(){
  "use strict";

  /* ===================== UTILIDADES ===================== */
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const RAD = Math.PI / 180;
  const SEGS = 9;

  const COLORS = ['#e63946','#f77f00','#2a9d8f','#3a86ff','#8338ec',
                  '#d81159','#0a9396','#bc6c25','#457b9d'];

  let audioCtx = null;
  function beep(freq, dur, type, vol){
    dur = dur || 0.08; type = type || 'sine'; vol = (vol === undefined) ? 0.12 : vol;
    try{
      if(!audioCtx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        audioCtx = new AC();
      }
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t);
      o.stop(t + dur + 0.03);
    }catch(e){ /* silencio */ }
  }
  function tickSnd(){ beep(1350, 0.018, 'square', 0.022); }
  function vibrate(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

  /* ===================== RULETA ===================== */
  class Wheel{
    constructor(canvas, wrap){
      this.canvas = canvas;
      this.wrap = wrap;
      this.ctx = canvas.getContext('2d');
      this.values = [1,2,3,4,5,6,7,8,9];
      this.rotation = Math.floor(Math.random() * 360);
      this.size = 200;
      this._lastIdx = -1;
      this._lastTickTime = 0;
    }

    resize(size){
      this.size = size;
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      this.canvas.width  = Math.round(size * dpr);
      this.canvas.height = Math.round(size * dpr);
      this.canvas.style.width  = size + 'px';
      this.canvas.style.height = size + 'px';
      this.wrap.style.width  = size + 'px';
      this.wrap.style.height = size + 'px';
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.draw();
    }

    draw(){
      const ctx = this.ctx;
      const s = this.size;
      if(!s) return;
      const r = s / 2;

      ctx.clearRect(0, 0, s, s);
      ctx.save();
      ctx.translate(r, r);

      // disco de fondo
      ctx.beginPath();
      ctx.arc(0, 0, r - 0.5, 0, Math.PI * 2);
      ctx.fillStyle = '#0d1728';
      ctx.fill();

      // gajos
      ctx.save();
      ctx.rotate(this.rotation * RAD);
      const seg = (Math.PI * 2) / SEGS;
      const rr = r * 0.94;

      for(let i = 0; i < SEGS; i++){
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, rr, i * seg, (i + 1) * seg);
        ctx.closePath();
        ctx.fillStyle = COLORS[i];
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0,0,0,.18)';
        ctx.stroke();
      }

      // números
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 ' + Math.round(r * 0.32) + 'px ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif';
      for(let i = 0; i < SEGS; i++){
        ctx.save();
        ctx.rotate(i * seg + seg / 2);
        ctx.translate(r * 0.66, 0);
        ctx.rotate(Math.PI / 2);
        ctx.fillText(String(this.values[i]), 0, 0);
        ctx.restore();
      }
      ctx.restore();

      // aro
      ctx.beginPath();
      ctx.arc(0, 0, rr, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(2, r * 0.05);
      ctx.strokeStyle = '#f1f5ff';
      ctx.stroke();

      // centro
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.15, 0, Math.PI * 2);
      ctx.fillStyle = '#0d1728';
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, r * 0.022);
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.stroke();

      ctx.restore();
    }

    spinTo(value, duration){
      const self = this;
      return new Promise(function(resolve){
        const idx = self.values.indexOf(value);
        const segDeg = 360 / SEGS;
        const mid = idx * segDeg + segDeg / 2;

        // El puntero está arriba (-90°). Queremos que el centro del gajo quede ahí.
        const desired = (((-90 - mid) % 360) + 360) % 360;
        const current = ((self.rotation % 360) + 360) % 360;
        const delta = (((desired - current) % 360) + 360) % 360;

        const start = self.rotation;
        const end = start + 360 * 4 + delta;
        const t0 = performance.now();

        function step(now){
          const p = Math.min(1, (now - t0) / duration);
          const e = 1 - Math.pow(1 - p, 3.2);
          self.rotation = start + (end - start) * e;
          self.draw();

          // chasquido al pasar por un número
          const ang = (((-90 - self.rotation) % 360) + 360) % 360;
          const idxUnder = Math.floor(ang / segDeg);
          if(idxUnder !== self._lastIdx){
            self._lastIdx = idxUnder;
            const t = performance.now();
            if(t - self._lastTickTime > 55){
              self._lastTickTime = t;
              tickSnd();
            }
          }

          if(p < 1){
            requestAnimationFrame(step);
          }else{
            self.rotation = end % 360;
            self.draw();
            resolve();
          }
        }
        requestAnimationFrame(step);
      });
    }
  }

  /* ===================== INSTANCIAS ===================== */
  const wheel1 = new Wheel($('w1'), $('wrap1'));
  const wheel2 = new Wheel($('w2'), $('wrap2'));

  function layout(){
    const area = $('wheels');
    const rect = area.getBoundingClientRect();
    if(rect.width < 10 || rect.height < 10) return;
    const sign = document.querySelector('.x-sign');
    const signW = sign ? sign.getBoundingClientRect().width : 30;
    const availW = Math.max(70, rect.width - signW - 22);
    const availH = Math.max(70, rect.height - 6);
    const size = Math.floor(Math.min(availH, availW / 2, 460));
    wheel1.resize(size);
    wheel2.resize(size);
  }

  /* ===================== ESTADO DEL JUEGO ===================== */
  const ROUND_TIME = 10;          // segundos para responder
  let state = 'idle';             // idle | spinning | answering
  let cur = { a:0, b:0, p:0 };
  let hits = 0, misses = 0;
  let typed = '';
  let rafId = null;

  function setTimer(t){
    t = Math.max(0, Math.min(ROUND_TIME, t));
    $('timerNum').textContent = Math.ceil(t);
    $('timerBar').style.width = (t / ROUND_TIME * 100) + '%';
    const low = (t <= 3.05 && t > 0);
    $('timerNum').classList.toggle('low', low);
    $('timerBar').classList.toggle('low', low);
  }

  function showAnswer(text, color){
    const el = $('aText');
    el.textContent = text;
    el.style.color = color || '#ffd166';
  }

  function setTyped(v){
    typed = v;
    showAnswer(v === '' ? '?' : v, '#ffd166');
  }

  function updateScore(){
    $('hits').textContent = hits;
    $('misses').textContent = misses;
  }

  let flashTimer = null;
  function flash(cls){
    const d = $('display');
    d.classList.remove('flash-ok', 'flash-bad');
    void d.offsetWidth;
    d.classList.add(cls);
    if(flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){
      d.classList.remove('flash-ok', 'flash-bad');
    }, 1100);
  }

  /* ===================== FLUJO DE PARTIDA ===================== */
  async function girar(){
    if(state === 'spinning' || state === 'answering') return;

    state = 'spinning';
    $('spinBtn').disabled = true;
    $('keypad').classList.add('disabled');
    typed = '';
    showAnswer('?', '#ffd166');
    $('qText').textContent = '? × ?';
    setTimer(ROUND_TIME);

    const a = 1 + Math.floor(Math.random() * 9);
    const b = 1 + Math.floor(Math.random() * 9);
    cur = { a: a, b: b, p: a * b };

    // Primera ruleta
    await wheel1.spinTo(a, 1500 + Math.random() * 500);
    beep(780, 0.11, 'triangle', 0.11);
    await sleep(220);
    if(state !== 'spinning') return;

    // Segunda ruleta
    await wheel2.spinTo(b, 1500 + Math.random() * 500);
    beep(780, 0.11, 'triangle', 0.11);
    await sleep(250);
    if(state !== 'spinning') return;

    // Fase de respuesta
    state = 'answering';
    $('qText').textContent = a + ' × ' + b;
    $('keypad').classList.remove('disabled');
    setTyped('');
    startCountdown();
  }

  function startCountdown(){
    const t0 = performance.now();
    function step(){
      const left = ROUND_TIME - (performance.now() - t0) / 1000;
      if(left <= 0){
        rafId = null;
        setTimer(0);
        endRound(false);
        return;
      }
      setTimer(left);
      rafId = requestAnimationFrame(step);
    }
    rafId = requestAnimationFrame(step);
  }

  function endRound(win){
    if(state !== 'answering') return;
    state = 'idle';

    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    $('keypad').classList.add('disabled');
    $('spinBtn').disabled = false;

    showAnswer(String(cur.p), win ? '#4ade80' : '#f87171');

    if(win){
      hits++;
      flash('flash-ok');
      beep(900, 0.12, 'triangle', 0.15);
      setTimeout(function(){ beep(1200, 0.18, 'triangle', 0.15); }, 110);
      vibrate(70);
    }else{
      misses++;
      flash('flash-bad');
      beep(170, 0.35, 'sawtooth', 0.12);
      vibrate([60, 60, 60]);
    }
    updateScore();
  }

  function submit(){
    if(state !== 'answering' || typed === '') return;
    const v = parseInt(typed, 10);
    if(isNaN(v)) return;
    if(v === cur.p){
      endRound(true);
    }else{
      beep(230, 0.12, 'square', 0.09);
      vibrate(35);
      flash('flash-bad');
      setTyped('');
    }
  }

  /* ===================== CONTROLES ===================== */
  $('keypad').addEventListener('pointerdown', function(e){
    const btn = e.target.closest('button');
    if(!btn || state !== 'answering') return;
    e.preventDefault();
    const k = btn.dataset.k;
    if(k === 'del'){
      setTyped(typed.slice(0, -1));
    }else if(k === 'ok'){
      submit();
    }else{
      if(typed.length < 3) setTyped(typed + k);
    }
    vibrate(8);
  });

  $('spinBtn').addEventListener('click', function(){
    girar();
  });

  window.addEventListener('keydown', function(e){
    if(e.repeat) return;
    if(e.key >= '0' && e.key <= '9'){
      if(state === 'answering' && typed.length < 3) setTyped(typed + e.key);
    }else if(e.key === 'Backspace'){
      if(state === 'answering'){ e.preventDefault(); setTyped(typed.slice(0, -1)); }
    }else if(e.key === 'Enter'){
      e.preventDefault();
      if(state === 'answering') submit(); else girar();
    }else if(e.key === ' '){
      e.preventDefault();
      girar();
    }
  });

  /* ===================== ARRANQUE ===================== */
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 350); });
  window.addEventListener('load', layout);

  updateScore();
  setTimer(ROUND_TIME);
  layout();
  requestAnimationFrame(layout);
  setTimeout(layout, 250);
  setTimeout(layout, 800);
})();
</script>
</body>
</html>
