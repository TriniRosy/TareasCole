<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Organizador Kawaii de Trinidad 🌸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/tema.css">
    <link rel="stylesheet" href="./css/componentes.css">
    <link rel="stylesheet" href="./css/asignaturas.css">
</head>
<body>
    <!-- Elementos decorativos flotantes -->
    <div class="flotante" style="top:8%; left:3%;">🌸</div>
    <div class="flotante" style="top:15%; right:5%; animation-delay:1.5s;">⭐</div>
    <div class="flotante" style="bottom:20%; left:5%; animation-delay:3s;">💖</div>
    <div class="flotante" style="bottom:12%; right:8%; animation-delay:4.5s;">✨</div>
    <div class="flotante" style="top:45%; left:50%; animation-delay:2s; font-size:1.4rem; opacity:0.4;">🌷</div>
    <div class="flotante" style="top:65%; right:3%; animation-delay:5s;">🎀</div>
    <div class="flotante" style="bottom:35%; left:2%; animation-delay:3.8s;">💕</div>

    <!-- Barra superior con botón hamburguesa -->
    <header class="barra-superior">
        <button class="boton-hamburguesa" id="boton-hamburguesa" aria-label="Abrir menú">☰</button>
        <span class="titulo-app">🌸 Organizador Kawaii 🌸</span>
        <span class="nombre-usuario">✨ Trinidad Quilodrán ✨</span>
    </header>

    <!-- Fondo oscuro para menú móvil -->
    <div class="fondo-oscuro" id="fondo-oscuro"></div>

    <!-- Estructura principal: barra lateral + contenido -->
    <div class="cuerpo">
        <!-- La barra lateral se insertará aquí mediante JavaScript -->
        <nav class="barra-lateral-contenedor" id="barra-lateral-contenedor"></nav>

        <!-- Contenido dinámico de la SPA -->
        <main id="contenido-principal" class="contenido-principal">
     <!-- Aquí se renderizará la vista activa -->
        </main>
    </div>

    <!-- Pie de página -->
    <footer class="pie-pagina">
        Hecho con <span class="corazon">💖</span> para Trinidad Quilodrán · 5° Básico · Chile 🇨🇱
    </footer>

    <!-- Script principal de la aplicación (ES Modules) -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
